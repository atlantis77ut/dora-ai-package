# ORL 6 Fazlı Uygulama Yaşam Döngüsü — Onboarding Tanımı
#
# Amaç: bir kurum paketi satın aldığında ajanların 6 fazda nasıl kurulacağını,
# eğitileceğini ve ne zaman otonom çalışmaya bırakılacağını tanımlar.
#
# Kaynak: dora-tam-konusma.md satır 4538-4593 (ORL tabanlı plan),
#         satır 929-1238 (eski 8 adımlı wizard), satır 4717 (ORL eşleştirmesi)
# Şema: schema/processes.schema.json ile aynı SLA sözlüğünü kullanır.

lifecycle:
  id: ORL-IMPL-6
  version: "1.0.0"
  generated_at: "2026-10-30"
  framework: "Implementation Lifecycle (6 faz)"
  platform: "harici referans platform"
  dora_ref:
    article: "Madde 6, 8, 16"
    note: "Orantılılık (Madde 16) gereği tier3 kurumlarda faz 4-5 basitleştirilebilir"

# Ajan otonomi merdiveni: her faz bir sonraki seviyeye geçiş kapısıdır.
autonomy_ramp:
  observe:
    description: "Ajan yalnızca izler ve kaydeder; hiçbir çıktı kullanılmaz"
    phases: [1, 2]
  recommend:
    description: "Ajan öneri üretir; insan karar verir, öneri kaydedilir"
    phases: [3, 4]
  act_with_approval:
    description: "Ajan icra eder, ancak her kritik adımda insan onayı gerekir"
    phases: [5, 6]
  act_autonomous:
    description: "Onaylı yetki sınırları içinde otonom icra; denetim izi zorunlu"
    phases: [6]
    precondition: "Faz 6 geçiş kapısı + yönetim kurulu onayı"

phases:

  # ═══════════════════════════════════════════════════════════════
  - id: C1
    name:
      tr: "Faz 1 — Önemli İş Hizmetlerinin Belirlenmesi (Identify)"
      en: "Phase 1 — Identify Critical Business Services"
    lifecycle_phase: Identify
    purpose: "Lisans ve kurum profilini sabitle, tier'ı belirle, iş hizmetleri kataloğunu (BSC) oluştur."
    corresponds_to_old_steps: [0, 1, 2]
    wizard_steps:
      - { id: C1-S1, name: "Lisans doğrulama", module: step-0-license }
      - { id: C1-S2, name: "Kurum profili ve tier seçimi", module: step-1-profile }
      - { id: C1-S3, name: "Yargı alanı ve regülatör eşleme", module: step-2-jurisdiction }
      - { id: C1-S4, name: "İş hizmetleri kataloğu (BSC) oluşturma", module: orl-bsc }
    agents:
      observe: [ROL-RSK-01, ROL-CIO-01]
      description: "RSK ajanı hizmetleri envanterler, CIO ajanı kritiklik önerisi üretir; onay insanda."
    human_roles:
      - { role: "Proje sahibi", duty: "BSC kapsamını onaylar" }
      - { role: "CIO", duty: "Kritik veya önemli işlev listesini imzalar" }
    kib_artifacts:
      - OR.KIB.BSACM
      - OR.KIB.ARCH
    outputs:
      - onboarding-session.yaml
      - institution-profile.yaml
      - jurisdiction-config.yaml
      - business-service-catalogue.yaml
    exit_gate:
      criteria:
        - "Her iş hizmeti bir sahibe ve bir ICT varlığına bağlı"
        - "Kritik veya önemli işlevler işaretli (Madde 3(22) kriteriyle)"
        - "Tier seçimi gerekçelendirilmiş ve kaydedilmiş"
        - "Regülatör bildirim kanalı tanımlı"
      blocks_next_phase: true
    duration_days: 10

  # ═══════════════════════════════════════════════════════════════
  - id: C2
    name:
      tr: "Faz 2 — Etki Toleranslarının Belirlenmesi (Set Tolerances)"
      en: "Phase 2 — Set Impact Tolerances"
    lifecycle_phase: Set tolerances
    purpose: "Her kritik hizmet için MTD/RTO/RPO ve risk iştahı eşiklerini belirle; SLA'ları buradan türet."
    corresponds_to_old_steps: [5]
    wizard_steps:
      - { id: C2-S1, name: "Etki toleransı tanımlama (hizmet bazında)", module: orl-tolerance }
      - { id: C2-S2, name: "Risk iştahı ve eşikler", module: orl-appetite }
      - { id: C2-S3, name: "SLA türetme ve yerel override", module: step-5-sla }
      - { id: C2-S4, name: "Ekonomik etki modeli (büyük olay kriteri)", module: orl-economic-impact }
    agents:
      observe: [ROL-CIO-01, ROL-RSK-01]
      description: "Ajanlar öneri üretir: tolerans önerisi, SLA çakışma uyarısı. Onay yönetim kurulunda."
    human_roles:
      - { role: "Yönetim Kurulu", duty: "Risk iştahı ve toleransları onaylar" }
      - { role: "CRO", duty: "Tolerans aşımlarının raporlanmasını sahiplenir" }
    kib_artifacts:
      - OR.KIB.RMDM
    outputs:
      - impact-tolerances.yaml
      - risk-appetite.yaml
      - sla-overrides.yaml
    exit_gate:
      criteria:
        - "Her kritik hizmet için MTD, RTO, RPO tanımlı"
        - "Tolerans değerleri regülatör asgari süreleriyle çelişmiyor"
        - "SLA override'ları yalnızca daha katı yönde (DORA taban çizgisi korunuyor)"
        - "Ekonomik etki eşiği (100.000 EUR) kuruma uyarlanmış"
      blocks_next_phase: true
    duration_days: 8

  # ═══════════════════════════════════════════════════════════════
  - id: C3
    name:
      tr: "Faz 3 — Kaynakların Haritalanması ve Ajan Aktivasyonu (Map Resources)"
      en: "Phase 3 — Map Resources and Activate Agents"
    lifecycle_phase: Map resources
    purpose: "ICT envanterini, tedarikçi bağımlılıklarını ve ajan/insan eşlemesini kur; bağımsızlığı kanıtla."
    corresponds_to_old_steps: [3, 4, 6]
    wizard_steps:
      - { id: C3-S1, name: "ICT ve tedarikçi envanteri içe aktarma", module: step-3-inventory }
      - { id: C3-S2, name: "Kritiklik ve CTPP işaretleme", module: orl-criticality }
      - { id: C3-S3, name: "Ajan aktivasyonu (tier matrisi)", module: step-4-agents }
      - { id: C3-S4, name: "İnsan muadili atama", module: step-4-agents }
      - { id: C3-S5, name: "Bağımsızlık kontrolleri", module: step-4-agents }
      - { id: C3-S6, name: "Entegrasyon konnektörleri (SIEM/ITSM/GRC/CMDB)", module: step-6-integration }
      - { id: C3-S7, name: "ORL süreç eşleştirmesini KIB'e yazma", module: orl-mapping-sync }
    agents:
      observe: [ROL-RSK-01, ROL-TPP-01, ROL-CTPP-01]
      recommend: [ROL-CIO-01, ROL-CMP-01]
      description: "RSK/TPP envanteri besler, CTPP gözetim listesini işaretler, CMP bağımsızlık kontrollerini doğrular."
    human_roles:
      - { role: "ICT Risk Yöneticisi", duty: "Envanter doğruluğunu onaylar" }
      - { role: "Uyum Müdürü", duty: "Bağımsızlık sonuçlarını imzalar" }
    kib_artifacts:
      - OR.KIB.RMDM
      - OR.KIB.BSACM
    independence_checks:
      - id: IND-01
        rule: "ROL-CMP-01.reports_to NOT IN ROL-INC-01.subordinates"
      - id: IND-02
        rule: "ROL-AUD-01.reports_to == 'Yönetim Kurulu'"
      - id: IND-03
        rule: "ROL-CIO-01.human_equivalent != ROL-CMP-01.human_equivalent"
      - id: IND-04
        rule: "1. hat ile 2. hat aynı yöneticiye bağlı değil"
    outputs:
      - ict-inventory.yaml
      - criticality-assessment.yaml
      - agent-activation.yaml
      - integration-config.yaml
    exit_gate:
      criteria:
        - "Her kritik hizmet en az bir varlık + bir tedarikçi ile eşleşti"
        - "Aktive edilen her ajanın insan muadili atandı"
        - "Dört bağımsızlık kontrolü PASS"
        - "Tüm zorunlu entegrasyonlar test bağlantısından geçti"
        - "ORL eşleştirmesi (agent-to-orl-mapping) KIB'de doğrulandı"
        - "Her OR.* süreç kodu en az bir aktive ajan tarafından sahiplenilmiş; sahipsiz kod yok"
        - "Her platform modülünün en az bir ajan bağlantısı var"
      blocks_next_phase: true
    duration_days: 20

  # ═══════════════════════════════════════════════════════════════
  - id: C4
    name:
      tr: "Faz 4 — Senaryo Testleri (Scenario Tests)"
      en: "Phase 4 — Scenario Tests"
    lifecycle_phase: Scenario tests
    purpose: "Ajanları sentetik senaryolarla sına; sınıflandırma ve bildirim doğruluğunu ölç."
    corresponds_to_old_steps: [7]
    wizard_steps:
      - { id: C4-S1, name: "Senaryo setini KIB'e yükleme", module: orl-scenarios }
      - { id: C4-S2, name: "Büyük olay simülasyonu (PRC-INC-01..04)", module: orl-run-scenario }
      - { id: C4-S3, name: "Tedarikçi çıkış simülasyonu (PRC-TPP-06)", module: orl-run-scenario }
      - { id: C4-S4, name: "Regülatör bilgi talebi simülasyonu (PRC-TPP-04)", module: orl-run-scenario }
      - { id: C4-S5, name: "Sonuç karşılaştırma ve kabul raporu", module: orl-acceptance }
    scenarios:
      - id: SCN-01
        name: "500.000 müşteriyi etkileyen 6 saatlik kesinti"
        expected: "PRC-INC-01 'büyük' sınıflandırır, PRC-INC-02 4 saat içinde tetiklenir, CIO onayı istenir"
      - id: SCN-02
        name: "Kritik tedarikçinin sözleşmesinin sona ermesi"
        expected: "PRC-TPP-06 çıkış planı üretir, PRC-TPP-04 RoI güncellenir"
      - id: SCN-03
        name: "Regülatörün 24 saat içinde bilgi talebi"
        expected: "PRC-TPP-04 kaydı 24 saatte üretilir, denetim izi eksiksiz"
    agents:
      recommend: [ROL-INC-01, ROL-TPP-01, ROL-CIO-01, ROL-AUD-01]
      description: "Ajanlar senaryoyu icra eder ama çıktı üretime gitmez; yalnızca kaydedilir."
    human_roles:
      - { role: "Test koordinatörü", duty: "Senaryoları çalıştırır, sapmaları raporlar" }
      - { role: "İç Denetim", duty: "Denetim izi bütünlüğünü doğrular" }
    outputs:
      - scenario-results.json
      - acceptance-report.pdf
    exit_gate:
      criteria:
        - "SCN-01 sınıflandırma doğruluğu >= %95"
        - "Tüm SLA tetiklemeleri beklenen sürede"
        - "İnsan onay noktaları gerçekten çalışıyor (onay kaydı var)"
        - "Denetim izi hash zinciri doğrulandı"
      blocks_next_phase: true
    duration_days: 12

  # ═══════════════════════════════════════════════════════════════
  - id: C5
    name:
      tr: "Faz 5 — Öz Değerlendirme (Self-Assessment)"
      en: "Phase 5 — Self-Assessment"
    lifecycle_phase: Self-assessment
    purpose: "DORA maddeleri bazında boşluk analizi; ajanların kapsamadığı kontrolleri ve riskleri görünür kıl."
    corresponds_to_old_steps: []
    wizard_steps:
      - { id: C5-S1, name: "Madde-süreç-kontrol kapsama matrisi", module: orl-coverage }
      - { id: C5-S2, name: "Boşluk analizi ve risk skoru", module: orl-gap-analysis }
      - { id: C5-S3, name: "Bağımsız kontrol fonksiyonu doğrulaması", module: orl-independent-review }
      - { id: C5-S4, name: "Olgunluk raporu", module: orl-maturity }
    agents:
      recommend: [ROL-CMP-01, ROL-AUD-01]
      description: "CMP boşlukları üretir, AUD bağımsız olarak doğrular; hiçbiri kendi bulgusunu kapatamaz."
    human_roles:
      - { role: "Uyum Müdürü", duty: "Boşluk analizini yönetim kuruluna sunar" }
      - { role: "Denetim Komitesi", duty: "Bağımsız doğrulamayı onaylar" }
    kib_artifacts:
      - OR.KIB.ARCH
    outputs:
      - coverage-matrix.yaml
      - gap-analysis.pdf
      - maturity-score.json
    exit_gate:
      criteria:
        - "Her DORA maddesi en az bir süreç veya gerekçeli istisna ile eşleşti"
        - "Kritik boşluk (severity=high) sayısı = 0 veya kabul edilmiş risk kaydı var"
        - "Olgunluk skoru kurum hedefinin altında değil"
        - "Bağımsız doğrulama imzalı"
      blocks_next_phase: true
    duration_days: 10
    tier_variants:
      tier3:
        note: "Basitleştirilmiş öz değerlendirme: 5 sütun bazında tek sayfa anket"

  # ═══════════════════════════════════════════════════════════════
  - id: C6
    name:
      tr: "Faz 6 — Yönetim İşletim Sisteminin Devreye Alınması (MOS)"
      en: "Phase 6 — Implement Management Operating System (MOS)"
    lifecycle_phase: Implement MOS
    purpose: "Gölge moddan otonom moda geçiş; izleme, sertifikasyon ve sürekli iyileştirme döngüsü."
    corresponds_to_old_steps: [8]
    wizard_steps:
      - { id: C6-S1, name: "Gölge mod başlatma (2 hafta)", module: step-8-golive }
      - { id: C6-S2, name: "Yarı-otomatik mod (1 ay)", module: step-8-golive }
      - { id: C6-S3, name: "Otonom mod yetkilendirmesi", module: orl-autonomy-grant }
      - { id: C6-S4, name: "MOS panosu ve KPI izleme", module: orl-mos-dashboard }
      - { id: C6-S5, name: "Regülasyon izleme ajanını devreye alma", module: orl-regwatch }
      - { id: C6-S6, name: "Sertifikasyon ve vaka kaydı", module: orl-certification }
    agents:
      act_with_approval: [ROL-INC-01, ROL-CIO-01, ROL-CTO-01, ROL-TPP-01, ROL-CMP-01, ROL-CEO-01]
      act_autonomous: [ROL-RSK-01, ROL-INF-01, ROL-TLPT-01]
      description: "Otonom yetki yalnızca düşük etkili, geri alınabilir işlemlerde verilir. CEO ajanı otonom yetki kararını hazırlar, onay yönetim kurulundadır."
    human_roles:
      - { role: "Yönetim Kurulu", duty: "Otonom mod yetkisini onaylar" }
      - { role: "CIO", duty: "Günlük MOS işletiminden sorumlu" }
    promotion_gates:
      shadow_to_semi:
        - "2 hafta boyunca yanlış sınıflandırma < %2"
        - "Tüm kararlar denetim izinde"
        - "SLA ihlali = 0"
      semi_to_auto:
        - "1 ay boyunca insan override < %5"
        - "SLA ihlali = 0"
        - "Yönetim kurulu onayı"
        - "Bağımsız denetim görüşü olumlu"
    outputs:
      - go-live-certificate.json
      - mos-dashboard-url
      - autonomy-grant.yaml
    exit_gate:
      criteria:
        - "Her ajanın otonomi seviyesi yazılı olarak atanmış"
        - "MOS panosu canlı ve KPI akıyor"
        - "Regülasyon izleme ajanı aktif"
        - "Yıllık gözden geçirme takvimi kurulmuş"
      blocks_next_phase: false
    duration_days: 45

# Sürekli döngü: MOS sonrası ORL fazları yıllık olarak tekrar çalışır.
continuous_cycle:
  cadence: annual
  reentry_phase: C2
  reason: "Toleranslar ve risk iştahı her yıl yeniden onaylanır; C1 yalnızca büyük yapısal değişiklikte tekrarlanır"
