# Ortak ters vekil ayarları — /etc/nginx/snippets/dora-proxy.conf
# Kaynak: deploy/nginx/dora-proxy.conf
#
# BACKEND_PORT yer tutucusu install-tls.mjs tarafından doldurulur.

proxy_pass http://127.0.0.1:__BACKEND_PORT__;
proxy_http_version 1.1;

# Uygulama bu başlıklara güvenir (yalnız yerel vekilden gelen isteklerde):
#   X-Forwarded-Proto: https → Secure çerez + HSTS
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Connection        "";

proxy_connect_timeout 5s;
# PDF raporu ve SIEM taraması uzun sürebilir
proxy_send_timeout 120s;
proxy_read_timeout 120s;
