# Giriş uç noktaları için IP başına hız sınırı — /etc/nginx/conf.d/dora-ratelimit.conf
# Kaynak: deploy/nginx/dora-ratelimit.conf
#
# Uygulama zaten kullanıcı adı başına kilit uygular (server.mjs loginAttempts);
# bu katman aynı IP'den çok sayıda farklı kullanıcı adı denemesini yavaşlatır.
#
# 30 r/m + 10 burst: elle giriş yapan kullanıcıyı etkilemez, betik denemesini keser.

limit_req_zone $binary_remote_addr zone=dora_auth:10m rate=30r/m;
