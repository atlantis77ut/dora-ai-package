name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Katalog doğrulaması (strict)
        working-directory: onboarding/cli
        run: node bin/dora-onboard.mjs validate --strict

      - name: DORA eşlemesi ve referans bütünlüğü
        run: node docs/tools/render-mapping.mjs --check

      # Not: build-dashboard çıktısına üretim zaman damgası gömüyor, bu yüzden
      # "commit edilmiş hâliyle birebir aynı mı" kontrolü deterministik değil.
      # Burada amaç sarkan referans varsa kırılmak (çıkış kodu 1).
      - name: Dashboard üretimi (sarkan referans kontrolü)
        run: node docs/tools/build-dashboard.mjs

      - name: Faz tanımı
        run: node onboarding/cli/bin/dora-onboard.mjs phases

      - name: Demo için geçici geliştirme anahtarı
        run: node onboarding/cli/tools/license-gen.mjs --init-dev-keys --force

      - name: Uçtan uca demo (6 faz)
        working-directory: onboarding/cli
        run: node tools/demo.mjs

      - name: Kanıt paketi ve bildirim formları (0.6)
        working-directory: onboarding/cli
        run: node tools/demo-export.mjs

      - name: Dış veri alımı ve takvim (0.8)
        working-directory: onboarding/cli
        run: node tools/demo-ingest.mjs

      - name: Senaryo çalıştırıcısı (1.1)
        working-directory: onboarding/cli
        run: node tools/demo-scenario.mjs

      - name: Kural motoru (1.4)
        working-directory: onboarding/cli
        run: node tools/demo-rules.mjs

      - name: Birim testleri (1.12)
        working-directory: onboarding/cli
        run: node tests/run.mjs

      - name: Kullanici el kitabi (1.26)
        run: node docs/tools/build-manual.mjs --check

  # Üretim artefaktları: şablonlar, kurulum betikleri ve yedek hattı.
  # Bu iş Linux'ta koşar; böylece `bash -n` ve gerçek yedek zinciri doğrulanır
  # (geliştirme makinesi Windows olduğunda shell betikleri yerelde denenemiyor).
  deploy-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Kabuk betikleri soz dizimi (bash -n)
        run: |
          set -euo pipefail
          for f in scripts/*.sh; do echo "— $f"; bash -n "$f"; done

      - name: Node betikleri soz dizimi
        run: |
          set -euo pipefail
          for f in scripts/*.mjs deploy/render.mjs; do node --check "$f"; done

      - name: TLS kurulum plani (dry-run)
        run: node scripts/install-tls.mjs --domain dora.ornek.local --email admin@ornek.local --dry-run --no-apt --skip-verify

      - name: Yedek timer plani (dry-run)
        run: node scripts/install-backup-timer.mjs --dry-run

      - name: Yedek hatti (uret -> dogrula -> buda)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/root/web-data" "$tmp/root/.dora-onboarding"
          echo '{"users":[]}' > "$tmp/root/web-data/users.json"
          echo 'satir' > "$tmp/root/web-data/audit.log"
          node scripts/backup-run.mjs --root "$tmp/root" --dest "$tmp/dest" --keep 1
          node scripts/backup-run.mjs --root "$tmp/root" --dest "$tmp/dest" --keep 1
          test "$(ls -1 "$tmp"/dest/dora-yedek-*.zip | wc -l)" -eq 1
          node scripts/backup-run.mjs --verify-only "$tmp"/dest/dora-yedek-*.zip
          test -f "$tmp/dest/son-yedek.json"
