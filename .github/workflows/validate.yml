name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Katalog doğrulaması (strict)
        working-directory: onboarding/cli
        run: node bin/dora-onboard.mjs validate --strict

      - name: DORA eşlemesi ve referans bütünlüğü
        run: node docs/tools/render-mapping.mjs --check

      # Not: build-dashboard çıktısına üretim zaman damgası gömüyor, bu yüzden
      # "commit edilmiş hâliyle birebir aynı mı" kontrolü deterministik değil.
      # Burada amaç sarkan referans varsa kırılmak (çıkış kodu 1).
      - name: Dashboard üretimi (sarkan referans kontrolü)
        run: node docs/tools/build-dashboard.mjs

      - name: Faz tanımı
        run: node onboarding/cli/bin/dora-onboard.mjs phases

      - name: Demo için geçici geliştirme anahtarı
        run: node onboarding/cli/tools/license-gen.mjs --init-dev-keys --force

      - name: Uçtan uca demo (6 faz)
        working-directory: onboarding/cli
        run: node tools/demo.mjs

      - name: Kanıt paketi ve bildirim formları (0.6)
        working-directory: onboarding/cli
        run: node tools/demo-export.mjs

      - name: Dış veri alımı ve takvim (0.8)
        working-directory: onboarding/cli
        run: node tools/demo-ingest.mjs

      - name: Senaryo çalıştırıcısı (1.1)
        working-directory: onboarding/cli
        run: node tools/demo-scenario.mjs

      - name: Kural motoru (1.4)
        working-directory: onboarding/cli
        run: node tools/demo-rules.mjs

      - name: Birim testleri (1.12)
        working-directory: onboarding/cli
        run: node --test tests/unit
