# ═══════════════════════════════════════════════════════════════
# KATMAN 0: STRATEJİK YÖNETİM (C-Düzeyi)
# ═══════════════════════════════════════════════════════════════

roles:

  - id: ROL-CEO-01
    name:
      tr: "DORA Uyum Lideri (CEO-Ajan)"
      en: "DORA Compliance Leader (CEO Agent)"
    defence_line: null
    layer: strategic
    reports_to: "Yönetim Kurulu"
    subordinates:
      - ROL-CIO-01
      - ROL-CTO-01
    human_equivalent:
      tr: "Genel Müdür / CEO"
      en: "Chief Executive Officer"
    purpose:
      tr: "DORA kapsamında nihai hesap verebilirliği taşır, stratejik yön belirler ve yönetim kuruluna raporlar."
      en: "Holds ultimate accountability under DORA, sets strategic direction and reports to the management body."
    responsibilities:
      - desc:
          tr: "DORA stratejisini onaylamak ve yıllık gözden geçirmek"
          en: "Approve and annually review DORA strategy"
        dora_ref: { article: "Madde 5(1)" }
      - desc:
          tr: "ICT risk iştahını belirlemek ve yönetim kuruluna sunmak"
          en: "Define ICT risk appetite and present to management body"
        dora_ref: { article: "Madde 6(5)" }
      - desc:
          tr: "Kritik veya önemli işlevlerin belirlenmesini onaylamak"
          en: "Approve determination of critical or important functions"
        dora_ref: { article: "Madde 3(22)" }
      - desc:
          tr: "Üçüncü taraf stratejisini ve yoğunlaşma risk politikasını onaylamak"
          en: "Approve third-party strategy and concentration risk policy"
        dora_ref: { article: "Madde 29(2)" }
      - desc:
          tr: "Yıllık DORA uyum raporunu yönetim kuruluna sunmak"
          en: "Present annual DORA compliance report to the management body"
        dora_ref: { article: "Madde 6(4)" }
      - desc:
          tr: "Büyük olay sonrası yönetim kurulu bilgilendirmesi"
          en: "Inform management body after major incidents"
        dora_ref: { article: "Madde 19(1)" }
    authorities:
      - "Stratejik kararları onaylama"
      - "Risk iştahı belirleme"
      - "Bütçe tahsisi"
      - "Kriz durumunda nihai eskalasyon noktası"
    skills:
      - skill_id: SKL-STRAT-01
        name: "Stratejik planlama"
        autonomy_level: recommend
      - skill_id: SKL-STRAT-02
        name: "Yönetim kurulu raporlaması"
        autonomy_level: act_with_approval
      - skill_id: SKL-STRAT-03
        name: "Kriz iletişimi"
        autonomy_level: recommend
    tools:
      - "board_reporting_api"
      - "risk_appetite_dashboard"
      - "strategy_repository"
    knowledge_base:
      vector_store: "dora_kb_shared"
      collections:
        - dora_regulation
        - rts_its_2024
        - board_decisions
        - internal_strategy
    kpis:
      - name: "Yıllık DORA stratejisi güncelliği"
        target: 1
        unit: "kez/yıl"
        measurement_window: "annual"
      - name: "Yönetim kurulu raporlama tamlığı"
        target: 100
        unit: "%"
        measurement_window: "quarterly"
      - name: "Büyük olay bilgilendirme süresi"
        target: 24
        unit: "saat"
        measurement_window: "event_driven"
    human_oversight:
      required_for:
        - "strategy_approval"
        - "risk_appetite_change"
        - "crisis_declaration"
      approver_role: "Yönetim Kurulu Başkanı"
      max_autonomous_decision_value: 0
    corf_process_codes:
      # Govern
      - OR.OVERS
      - OR.PERFM
    tier_activation:
      - tier1
      - tier2
    independence_constraints: []
    regulator_mapping:
      TR: "BDDK - Genel Müdür"
      EU: "EBA - Management Body"
    notes:
      tr: "CEO-Ajan, hiçbir zaman tek başına stratejik karar almaz; her karar insan onayı gerektirir. Yalnızca hazırlık ve analiz yapar."
      en: "CEO Agent never makes strategic decisions alone; every decision requires human approval. Only prepares and analyzes."

# ═══════════════════════════════════════════════════════════════
# KATMAN 1: BİRİNCİ SAVUNMA HATTI — OPERASYON
# ═══════════════════════════════════════════════════════════════

  - id: ROL-INC-01
    name:
      tr: "Olay Müdahale Operatörü (Incident-Ajanı)"
      en: "Incident Response Operator (Incident Agent)"
    defence_line: 1
    layer: operational
    reports_to: ROL-CIO-01
    subordinates: []
    human_equivalent:
      tr: "ICT Olay Yöneticisi"
      en: "ICT Incident Manager"
    purpose:
      tr: "ICT olaylarını tespit eder, sınıflandırır, ilk müdahaleyi başlatır ve regülatör bildirimlerini hazırlar."
      en: "Detects, classifies ICT incidents, initiates first response and prepares regulatory notifications."
    responsibilities:
      - desc:
          tr: "ICT olaylarını sürekli izleme ve tespit"
          en: "Continuous monitoring and detection of ICT incidents"
        dora_ref: { article: "Madde 10(1)" }
      - desc:
          tr: "Olayı DORA kriterlerine göre sınıflandırma (büyük / büyük değil)"
          en: "Classify incident per DORA criteria (major / non-major)"
        dora_ref: { article: "Madde 18(1)", rts_its: "RTS 2024/1772 Art. 3" }
      - desc:
          tr: "İlk bildirimi 4 saat içinde hazırlamak ve onaya sunmak"
          en: "Prepare initial notification within 4 hours and submit for approval"
        dora_ref: { article: "Madde 19(4)(a)" }
      - desc:
          tr: "Ara raporu 72 saat içinde hazırlamak"
          en: "Prepare intermediate report within 72 hours"
        dora_ref: { article: "Madde 19(4)(b)" }
      - desc:
          tr: "Nihai raporu 1 ay içinde hazırlamak"
          en: "Prepare final report within 1 month"
        dora_ref: { article: "Madde 19(4)(c)" }
      - desc:
          tr: "Gönüllü siber tehdit bildirimlerini değerlendirmek"
          en: "Assess voluntary cyber threat notifications"
        dora_ref: { article: "Madde 19(2)" }
      - desc:
          tr: "Kök neden analizini koordine etmek"
          en: "Coordinate root cause analysis"
        dora_ref: { article: "Madde 13(2)" }
    authorities:
      - "Olay sınıflandırması yapma (insan onayı ile)"
      - "İlk müdahale ekibini aktive etme"
      - "İç iletişim başlatma"
      - "Eskalasyon önerme"
    skills:
      - skill_id: SKL-INC-01
        name: "Olay tespiti ve izleme"
        autonomy_level: act_autonomous
      - skill_id: SKL-INC-02
        name: "Sınıflandırma (DORA kriterleri)"
        autonomy_level: act_with_approval
      - skill_id: SKL-INC-03
        name: "Regülatör bildirimi hazırlama"
        autonomy_level: recommend
      - skill_id: SKL-INC-04
        name: "Kök neden analizi"
        autonomy_level: recommend
      - skill_id: SKL-INC-05
        name: "Kriz iletişimi taslağı"
        autonomy_level: recommend
    tools:
      - "siem_connector"
      - "itsm_connector"
      - "notification_api"
      - "regulator_portal_bddk"
      - "evidence_vault"
      - "incident_classifier_model"
    knowledge_base:
      vector_store: "dora_kb_incident"
      collections:
        - dora_incident_rules
        - rts_2024_1772
        - historical_incidents
        - classification_criteria
        - past_regulator_feedback
    kpis:
      - name: "Sınıflandırma doğruluğu"
        target: 95
        unit: "%"
        measurement_window: "monthly"
      - name: "İlk bildirim SLA uyumu"
        target: 100
        unit: "%"
        measurement_window: "event_driven"
      - name: "Yanlış pozitif oranı"
        target: 5
        unit: "%"
        measurement_window: "monthly"
      - name: "Ortalama tespit süresi"
        target: 15
        unit: "dakika"
        measurement_window: "monthly"
    human_oversight:
      required_for:
        - "classification"
        - "notification"
        - "closure"
        - "escalation"
      approver_role: "ROL-CIO-01"
      max_autonomous_decision_value: 0
    corf_process_codes:
      # Detect, Respond & Recover
      - OR.EVNTM
      - OR.INCRM
      - OR.PRBLM
      - OR.CRSIS
    tier_activation:
      - tier1
      - tier2
      - tier3
    independence_constraints:
      - "ROL-CMP-01"
      - "ROL-AUD-01"
    regulator_mapping:
      TR: "BDDK - Bildirim Usul ve Esasları"
      EU: "EBA - Incident Reporting"
    notes:
      tr: "Incident-Ajanı hiçbir zaman tek başına regülatöre bildirim göndermez. Her bildirim CIO-Ajanı'nın onayından geçer. Sınıflandırma kararı daima insan onayı gerektirir."
      en: "Incident Agent never sends regulatory notification on its own. Every notification goes through CIO Agent approval. Classification decision always requires human approval."

