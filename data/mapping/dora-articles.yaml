# DORA madde → süreç / kontrol eşlemesi
#
# Amaç: C5 (öz değerlendirme) fazının kapsama matrisini beslemek.
# Her madde için: yükümlülük özeti, hangi süreçle karşılandığı, hangi kontrolle
# kanıtlandığı, sahibi ve kapsama durumu.
#
# status: covered (tam) | partial (kısmi — not alanı nedenini yazar) | gap (kapsanmıyor)

mapping:
  version: "1.1.0"
  generated_at: "2026-11-08"
  source: "Regulation (EU) 2022/2554 (DORA)"
  scope_note: >
    Yalnızca yükümlülük doğuran maddeler eşlendi; tanım maddeleri (3) ve
    kurumsal/yaptırım maddeleri kapsam dışı. Madde numaraları DORA resmi metnine göredir.

articles:

  - id: Art-05
    chapter: "Bölüm II — ICT Risk Yönetimi"
    title: "Yönetişim ve organizasyon"
    obligations:
      - "Yönetim organı ICT riskinden nihai sorumludur"
      - "ICT risk çerçevesi onaylanır ve yılda gözden geçirilir"
      - "Yeterli dijital operasyonel dayanıklılık uzmanlığı sağlanır"
    processes: [PRC-RSK-01]
    controls: [CTL-RSK-001]
    roles: [ROL-CEO-01, ROL-CIO-01]
    status: covered

  - id: Art-06
    chapter: "Bölüm II — ICT Risk Yönetimi"
    title: "ICT risk yönetim çerçevesi"
    obligations:
      - "Sağlam, kapsamlı ve iyi belgelenmiş ICT risk çerçevesi kurulur"
      - "Strateji, politika, prosedür, protokol ve araçlar tanımlanır"
      - "Çerçeve en az yılda bir gözden geçirilir"
    processes: [PRC-RSK-01, PRC-RSK-02]
    controls: [CTL-RSK-001, CTL-RSK-002]
    roles: [ROL-CIO-01, ROL-CMP-01]
    status: covered

  - id: Art-07
    chapter: "Bölüm II — ICT Risk Yönetimi"
    title: "ICT sistemleri, protokoller ve araçlar"
    obligations:
      - "Güvenilir, kapasitesi yeterli ve güncel ICT sistemleri kullanılır"
      - "Sistem yapılandırması ve sıkılaştırma standartları uygulanır"
    processes: [PRC-RSK-03, PRC-RSK-05]
    controls: [CTL-RSK-003, CTL-RSK-009]
    roles: [ROL-CTO-01, ROL-RSK-01]
    status: covered

  - id: Art-08
    chapter: "Bölüm II — ICT Risk Yönetimi"
    title: "Tanımlama"
    obligations:
      - "ICT varlıkları ve bağımlılıkları envanterlenir"
      - "Kritik veya önemli işlevler belirlenir"
      - "Kayıt dışı varlık bırakılmaz"
    processes: [PRC-RSK-02, PRC-RSK-03]
    controls: [CTL-RSK-003, CTL-RSK-004, CTL-RSK-006]
    roles: [ROL-RSK-01]
    status: covered
    note: "Değişiklik risk kapısı (CTL-RSK-006) Madde 8(4) kapsamında buraya bağlandı."

  - id: Art-09
    chapter: "Bölüm II — ICT Risk Yönetimi"
    title: "Koruma ve önleme"
    obligations:
      - "Erişim kontrolü, kimlik doğrulama ve şifreleme uygulanır"
      - "Ağ güvenliği ve segmentasyonu sağlanır"
      - "Veri ve sistemlerin bütünlüğü korunur"
    processes: [PRC-RSK-05]
    controls: [CTL-RSK-007, CTL-RSK-008, CTL-RSK-009, CTL-RSK-010]
    roles: [ROL-CTO-01, ROL-CMP-01]
    status: covered
    tier_note: "tier3: yıllık tek gözden geçirme yeterli (corf-lifecycle tier_variants)"

  - id: Art-10
    chapter: "Bölüm II — ICT Risk Yönetimi"
    title: "Tespit"
    obligations:
      - "Anormallikleri ve olayları zamanında tespit eden mekanizmalar kurulur"
      - "Tespit için izleme ve uyarı üretimi yapılır"
    processes: [PRC-INC-01]
    controls: [CTL-INC-001]
    roles: [ROL-INC-01]
