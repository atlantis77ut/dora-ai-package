  - id: Art-12
    chapter: "Bölüm II — ICT Risk Yönetimi"
    title: "Yedekleme politikaları, prosedürleri ve yöntemleri"
    obligations:
      - "Yedekleme ve geri yükleme test edilir"
      - "Yedekler kritik verileri kapsar ve ayrı konumda tutulur"
    processes: [PRC-RSK-04]
    controls: [CTL-RSK-005]
    roles: [ROL-CTO-01]
    status: partial
    note: "Geri yükleme testi BCP/DRP kanıtı içinde izleniyor; ayrı yedekleme kontrolü yok."

  - id: Art-13
    chapter: "Bölüm II — ICT Risk Yönetimi"
    title: "Öğrenme ve gelişme"
