    controls: [CTL-INC-009]
    roles: [ROL-CEO-01, ROL-INC-01]
    status: covered
    note: "PRC-INC-06 sözcü matrisi, 4 saatlik ilk açıklama ve düzeltme kuralını tanımlar; şablon CM-PRESS / CM-CUSTOMER."

