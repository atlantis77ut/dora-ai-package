    processes: [PRC-INC-04]
    controls: [CTL-INC-006, CTL-INC-007]
    roles: [ROL-CMP-01, ROL-INC-01]
    status: covered

  - id: Art-14
    chapter: "Bölüm II — ICT Risk Yönetimi"
    title: "İletişim"
    obligations:
      - "Kriz iletişimi planı ve sorumluları tanımlanır"
      - "Paydaşlara ve kamuya iletişim protokolü kurulur"
