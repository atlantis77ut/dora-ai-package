      en: "Payment incident segregation and dual-channel notification"
    process_id: PRC-INC-07
    type: detective
    owner_role: ROL-INC-01
    frequency: event_driven
    evidence_spec:
      format: json
      immutability: hash_chain
      fields:
        - { name: incident_id, type: string, required: true }
        - { name: payment_impact, type: boolean, required: true }
        - { name: payment_chain, type: string, required: false }
        - { name: affected_transactions, type: integer, required: false }
        - { name: dora_channel_sent_at, type: datetime, required: true }
        - { name: cb_channel_sent_at, type: datetime, required: false }
