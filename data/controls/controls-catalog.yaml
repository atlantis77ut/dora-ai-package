        - { name: template_version, type: string, required: true }
        - { name: audience, type: string, required: true }
        - { name: channel, type: string, required: true }
        - { name: approved_by, type: string, required: true }
        - { name: approved_at, type: datetime, required: true }
        - { name: published_at, type: datetime, required: true }
        - { name: within_sla, type: boolean, required: true }
    dora_ref: { article: "Madde 14" }
    test_procedure: "Tatbikatta ilk açıklama 4 saat içinde yayınlandı mı? Onaysız yayın var mı? (0 olmalı)"

  - id: CTL-INC-010
    name:
