  # ═══════════════════════════════════════════════════════════════
  # SÜTUN 4 — ÜÇÜNCÜ TARAF RİSKİ
  # ═══════════════════════════════════════════════════════════════

  - id: CTL-TPP-001
    name:
      tr: "Durum tespiti tamlık kontrolü"
      en: "Due diligence completeness check"
    process_id: PRC-TPP-01
    type: preventive
    owner_role: ROL-TPP-01
    frequency: event_driven
    evidence_spec:
      format: json
      immutability: append_only
      fields:
        - { name: provider_id, type: string, required: true }
        - { name: sections_completed, type: array<string>, required: true }
        - { name: score, type: number, required: true }
        - { name: decision, type: string, required: true }
        - { name: approved_by, type: string, required: true }
    dora_ref: { article: "Madde 28(4)" }
