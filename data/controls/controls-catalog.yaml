        - { name: days_open, type: integer, required: true }
        - { name: escalated, type: boolean, required: false }
    dora_ref: { article: "Madde 24(6)" }
    test_procedure: "30 günü aşmış açık kritik bulgu var mı? Varsa eskalasyon kaydı var mı?"

  - id: CTL-TST-004
    name:
      tr: "TLPT üç yıllık döngü sayacı"
      en: "TLPT three-year cycle counter"
    process_id: PRC-TST-03
    type: directive
    owner_role: ROL-TLPT-01
    frequency: annual
    evidence_spec:
