        - { name: root_cause_category, type: string, required: true }
        - { name: new_or_updated_control, type: string, required: true }
        - { name: updated_at, type: datetime, required: true }
        - { name: verified_by_audit, type: boolean, required: false }
    dora_ref: { article: "Madde 13(2)" }
    test_procedure: "'kontrol_eksikligi' kategorisindeki her olay için kontrol güncellemesi var mı?"

  - id: CTL-INC-008
    name:
      tr: "Gönüllü bildirim gizlilik kontrolü"
      en: "Voluntary notification confidentiality check"
    process_id: PRC-INC-05
    type: preventive
    owner_role: ROL-INF-01
    frequency: event_driven
