  - id: CTL-TST-003
    name:
      tr: "Kritik bulgu 30 gün kapatma takibi"
      en: "Critical finding 30-day closure tracking"
    process_id: PRC-TST-02
    type: corrective
    owner_role: ROL-CTO-01
    frequency: event_driven
    evidence_spec:
      format: json
      immutability: hash_chain
      fields:
        - { name: finding_id, type: string, required: true }
        - { name: severity, type: string, required: true }
        - { name: found_at, type: datetime, required: true }
