    test_procedure: "Ödeme zincirini etkileyen her olayda payment_impact=true ve iki kanal kaydı var mı?"

  # ═══════════════════════════════════════════════════════════════
  # SÜTUN 3 — DAYANIKLILIK TESTLERİ
  # ═══════════════════════════════════════════════════════════════

  - id: CTL-TST-001
    name:
      tr: "Yıllık test kapsam kontrolü"
      en: "Annual test coverage check"
    process_id: PRC-TST-01
    type: directive
    owner_role: ROL-CTO-01
