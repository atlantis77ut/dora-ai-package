        - { name: cleared_by, type: string, required: true }
    dora_ref: { article: "Madde 45(2)" }
    test_procedure: "Anonimleştirilmeden paylaşılmış kayıt var mı? (0 olmalı)"

  - id: CTL-INC-009
    name:
      tr: "Kriz iletişimi hazırlık ve onay kontrolü"
